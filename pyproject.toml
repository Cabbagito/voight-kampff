[project]
name = "voight-kampff"
version = "0.1.0"
description = "Personal alignment science / interpretability upskilling repo"
requires-python = ">=3.11,<3.12"
dependencies = [
    "torch>=2.4",
    "transformers>=4.45",
    "transformer-lens>=2.8",
    "nnsight>=0.3",
    "datasets>=3.0",
    "matplotlib>=3.9",
    "plotly>=5.24",
    "jupyter>=1.1",
    "einops>=0.8",
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "tqdm>=4.66",
    "ipykernel>=6.29",
]

[tool.uv]
# Pinned for reproducibility; bump intentionally.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = []
bypass-selection = true
